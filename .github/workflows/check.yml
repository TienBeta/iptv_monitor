# Kiểm tra stream. Không dùng cron của GitHub: Apps Script gắn với Google Sheet
# gọi workflow này theo lịch tự chạy (đổi được trên dashboard) và khi bấm "Chạy ngay".
name: IPTV check

on:
  workflow_dispatch:

# Mỗi lúc chỉ một lần chạy; lần mới xếp hàng chờ, không huỷ lần đang chạy.
concurrency:
  group: iptv-check
  cancel-in-progress: false

permissions:
  contents: write # đẩy dashboard + results.json lên nhánh gh-pages

jobs:
  check:
    runs-on: ubuntu-24.04 # ffmpeg 6.1 từ apt — đúng bản đã test
    timeout-minutes: 170
    steps:
      - name: Kiểm tra cấu hình
        id: cfg
        env:
          BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.SHEET_BRIDGE_TOKEN }}
        run: |
          if [ -n "$BRIDGE_URL" ] && [ -n "$BRIDGE_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::Chưa có secret SHEET_BRIDGE_URL / SHEET_BRIDGE_TOKEN — bỏ qua lần chạy này (xem docs/setup.md)."
          echo "ready=false" >> "$GITHUB_OUTPUT"
          # Thiếu cấu hình: chạy tay thì báo lỗi rõ ràng (sự kiện khác, nếu có, bỏ qua êm).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then exit 1; fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Cài ffmpeg (cho mức 4a/4b và link rtmp/rtsp/srt)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if ! command -v ffprobe > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          fi
          ffprobe -version | head -1

      - name: Kiểm tra stream
        if: steps.cfg.outputs.ready == 'true'
        env:
          SHEET_BRIDGE_URL: ${{ secrets.SHEET_BRIDGE_URL }}
          SHEET_BRIDGE_TOKEN: ${{ secrets.SHEET_BRIDGE_TOKEN }}
          UV_THREADPOOL_SIZE: '64'
        run: node checker/index.js

      - name: Đăng dashboard lên gh-pages
        if: always() && steps.cfg.outputs.ready == 'true' && hashFiles('dist/results.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          cp -r site/. public/
          # Pages lets browsers cache files for 10 minutes: version the CSS/JS
          # links so a new index.html never runs with an old cached app.js/style.css.
          v=$(cat site/app.js site/style.css | sha256sum | cut -c1-10)
          sed -i -E "s/(href|src)=\"(style\.css|app\.js)\"/\1=\"\2?v=${v}\"/" public/index.html
          grep -q "app.js?v=${v}" public/index.html && grep -q "style.css?v=${v}" public/index.html
          cp dist/results.json public/
          touch public/.nojekyll
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cập nhật kết quả $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
