<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTV Monitor</title>
  <meta name="description" content="Tình trạng các kênh IPTV, cập nhật tự động mỗi 3 giờ">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='4' width='20' height='13' rx='2' fill='%231A73E8'/%3E%3Crect x='8' y='19' width='8' height='2' rx='1' fill='%231A73E8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><rect x="8" y="19" width="8" height="2" rx="1"/></svg>
        <h1>IPTV Monitor</h1>
      </div>
      <div class="appbar-meta">
        <span id="updated" class="updated" aria-live="polite">Đang tải dữ liệu…</span>
        <button id="refresh" class="icon-btn" type="button" aria-label="Làm mới dữ liệu" title="Làm mới dữ liệu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="context" class="context"></p>

    <div id="banner" class="callout callout-warn" role="status" hidden></div>

    <section class="metrics" id="metrics" aria-label="Tổng hợp"></section>

    <section class="card table-card" aria-label="Danh sách kênh">
      <div class="toolbar" role="search">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="q" type="search" placeholder="Tìm tên kênh hoặc link…" aria-label="Tìm tên kênh hoặc link" autocomplete="off">
        </label>
        <select id="status" aria-label="Lọc theo trạng thái"></select>
        <select id="country" aria-label="Lọc theo quốc gia"></select>
        <div class="toolbar-end">
          <button id="clear" class="text-btn" type="button" hidden>Xoá bộ lọc</button>
          <span id="count" class="count" aria-live="polite"></span>
        </div>
      </div>

      <div class="table-scroll">
        <table>
          <colgroup>
            <col class="col-name"><col class="col-country"><col class="col-status"><col class="col-time"><col class="col-link">
          </colgroup>
          <thead>
            <tr>
              <th scope="col"><button type="button" data-sort="title">Tên kênh<span class="sort-ico" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" data-sort="countryName">Quốc gia<span class="sort-ico" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" data-sort="status">Trạng thái<span class="sort-ico" aria-hidden="true"></span></button></th>
              <th scope="col"><button type="button" data-sort="lastChecked">Kiểm tra lúc<span class="sort-ico" aria-hidden="true"></span></button></th>
              <th scope="col">Link</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div id="empty" class="state" hidden>
        <p class="state-title">Không có kênh nào khớp bộ lọc.</p>
        <button id="empty-clear" class="btn" type="button">Xoá bộ lọc</button>
      </div>

      <div id="error" class="state" hidden>
        <p class="state-title" id="error-title"></p>
        <p class="state-text" id="error-text"></p>
        <button id="retry" class="btn" type="button">Thử lại</button>
      </div>

      <div class="table-foot" id="table-foot" hidden>
        <span id="shown" class="shown"></span>
        <button id="more" class="btn" type="button" hidden></button>
      </div>
    </section>

    <aside class="callout callout-info note">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <p>
        Dữ liệu kênh từ <a href="https://github.com/iptv-org/iptv" rel="noopener">iptv-org</a>.
        Máy kiểm tra đặt ở Mỹ, nên kênh có nhãn “Giới hạn quốc gia” có thể báo lỗi dù xem ở Việt Nam vẫn được.
      </p>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
